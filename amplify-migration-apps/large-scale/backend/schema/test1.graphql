# Test1 - Mega model with 30 fields, 10 relations, and 5 indexes with sort keys
type Test1 @model @auth(rules: [
  { allow: public, operations: [read] },
  { allow: owner, operations: [create, read, update, delete] }
]) {
  id: ID!
  # Scalar fields
  title: String!
  description: String
  status: ProjectStatus! @index(name: "byStatusAndCreatedAt", sortKeyFields: ["createdAt", "priority"])
  priority: Priority! @index(name: "byPriorityAndDeadline", sortKeyFields: ["deadline", "status"])
  category: Category! @index(name: "byCategoryAndTitle", sortKeyFields: ["title", "score"])
  score: Int
  rating: Float
  isActive: Boolean
  deadline: AWSDateTime
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
  startDate: AWSDate
  endDate: AWSDate
  duration: Int
  ownerEmail: AWSEmail @index(name: "byOwnerAndScore", sortKeyFields: ["score", "createdAt"])
  websiteUrl: AWSURL
  phoneNumber: AWSPhone
  region: String @index(name: "byRegionAndUpdatedAt", sortKeyFields: ["updatedAt", "category"])
  tags: [String]
  version: Int
  weight: Float
  # Custom type fields
  address: Address
  metadata: Metadata
  coordinates: Coordinates
  notes: [String]
  config: AWSJSON
  ipAddress: AWSIPAddress
  timestamp: AWSTimestamp
  # Relation fields (10 relations)
  test2Items: [Test2] @hasMany(indexName: "byTest1", fields: ["id"])
  test3Items: [Test3] @hasMany(indexName: "byTest1", fields: ["id"])
  test4Items: [Test4] @hasMany(indexName: "byTest1", fields: ["id"])
  test5Items: [Test5] @hasMany(indexName: "byTest1", fields: ["id"])
  test6Items: [Test6] @hasMany(indexName: "byTest1", fields: ["id"])
  parentTest7: Test7 @hasOne
  parentTest8: Test8 @hasOne
  parentTest9: Test9 @hasOne
  parentTest10: Test10 @hasOne
  parentTest11: Test11 @hasOne
}
